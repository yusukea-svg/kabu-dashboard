# 銘柄ユニバース（絞り込み条件）。値を変えたら次回の日次バッチから反映される。

# 対象とする市場区分（JPX上場銘柄一覧の「市場・商品区分」に含まれる文字列）
markets:
  - プライム（内国株式）
  - スタンダード（内国株式）
  - グロース（内国株式）

# 絞り込み条件（すべて満たした銘柄を「ユニバース」とする）
price_min: 100            # 終値の下限（円）
price_max: 5000           # 終値の上限（円）
avg_volume20_min: 30000   # 20日平均出来高の下限（株）
avg_value20_min: 30000000 # 20日平均売買代金の下限（円）= 3,000万円

# 場中更新の対象数。ユニバースのうち20日平均売買代金の上位N件。
# 仮の値。bench ワークフローで GitHub Actions 上の実測をしてから決める。
intraday_max_count: 300
