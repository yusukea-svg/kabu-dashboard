# 世界情勢・企業情報のデータ源。利用条件は docs/terms.md に記録してから追加する。

macro:
  history_days: 400        # 保持する日数（推移グラフ用）
  # yfinance（指数・為替・商品）。id は「yf:」+ ティッカー
  yfinance:
    - { ticker: "^N225",    label: "日経平均",            category: 株価指数, unit: "円" }
    - { ticker: "1306.T",   label: "TOPIX連動ETF(1306)",  category: 株価指数, unit: "円" }
    - { ticker: "^GSPC",    label: "S&P500",              category: 株価指数, unit: "pt" }
    - { ticker: "^IXIC",    label: "NASDAQ総合",          category: 株価指数, unit: "pt" }
    - { ticker: "^DJI",     label: "NYダウ",              category: 株価指数, unit: "ドル" }
    - { ticker: "JPY=X",    label: "ドル円",              category: 為替,     unit: "円" }
    - { ticker: "EURJPY=X", label: "ユーロ円",            category: 為替,     unit: "円" }
    - { ticker: "^VIX",     label: "VIX（恐怖指数）",     category: 変動率,   unit: "pt" }
    - { ticker: "CL=F",     label: "WTI原油",             category: 商品,     unit: "ドル" }
    - { ticker: "GC=F",     label: "金",                  category: 商品,     unit: "ドル" }
  # FRED（米国の金利など）。FRED_API_KEY が未設定ならスキップする。id は「fred:」+ 系列ID
  fred:
    - { series: "DGS10",  label: "米10年国債利回り",     category: 金利, unit: "%" }
    - { series: "DGS2",   label: "米2年国債利回り",      category: 金利, unit: "%" }
    - { series: "T10Y2Y", label: "米10年-2年 金利差",    category: 金利, unit: "%" }
    - { series: "DFF",    label: "米FF金利（実効）",     category: 金利, unit: "%" }

news:
  keep_days: 14
  feeds:
    - { name: "Yahoo!ニュース 経済", url: "https://news.yahoo.co.jp/rss/topics/business.xml" }
    - { name: "Yahoo!ニュース 国際", url: "https://news.yahoo.co.jp/rss/topics/world.xml" }
    - { name: "NHK 経済",            url: "https://news.web.nhk/n-data/conf/na/rss/cat5.xml" }

edinet:
  # EDINET_API_KEY が未設定ならスキップする
  lookback_days: 7          # 毎回さかのぼって確認する日数（取りこぼし対策）
  initial_days: 120         # 初回にさかのぼる日数
  # 取り込む書類（EDINET の書類種別コード）
  doc_types:
    "120": 有価証券報告書
    "130": 訂正有価証券報告書
    "160": 半期報告書
    "180": 臨時報告書
    "220": 自己株券買付状況報告書
    "235": 内部統制報告書

earnings:
  # JPX「決算発表予定日」の掲載ページ。ページ内の kessan*.xlsx をすべて取得する。リポジトリには保存しない。
  # 3月期・9月期に限らず、各月に期末・四半期末を迎えた会社の一覧が月ごとに載る。
  page_url: https://www.jpx.co.jp/listing/event-schedules/financial-announcement/index.html
  scope: universe          # universe（ユニバース）| intraday（場中更新の対象）| all（全上場銘柄）
  max_per_day: 0           # 1日あたりに名前を載せる上限（売買代金の大きい順）。0 で上限なし（全銘柄）
